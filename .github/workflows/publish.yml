name: Publish approved post

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  publish:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post to Facebook
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python publish_post.py
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Published."
