name: Daily drafts

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate drafts
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python generate_draft.py
      - name: Open review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create draft --color BFD4F2 --force
          gh label create approved --color 0E8A16 --force
          for f in drafts/*.md; do
            gh issue create \
              --title "$(cat "${f%.md}.title")" \
              --body-file "$f" \
              --label draft
          done
